spring.application.name=employee-management-system
server.port=8080

# ---- MySQL (default). Change username/password here OR via environment variables ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# demo data on first run
app.seed-data=true

springdoc.swagger-ui.path=/swagger-ui.html
